name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
      - run: anvil validate examples/tickets.json
      - run: anvil plan examples/tickets.json --json
      - run: anvil validate examples/parallel-tickets.json
      - run: anvil plan examples/parallel-tickets.json --json
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: anvil --version
